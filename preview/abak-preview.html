<meta charset="utf-8">
<script>/* Переключатель темы. Выбор хранится в localStorage этого браузера (только на этом устройстве).
   Без выбора берётся тема устройства. Чтобы задать тему по умолчанию, впишите 'light' или 'dark' в DEFAULT. */
(function(){
  var K='tbl.theme',DEFAULT=null,R=document.documentElement,MQ=null;
  try{MQ=window.matchMedia('(prefers-color-scheme: dark)');}catch(e){}
  function saved(){try{var v=localStorage.getItem(K);return v==='dark'||v==='light'?v:null;}catch(e){return null;}}
  function sys(){return MQ&&MQ.matches?'dark':'light';}
  function set(t){
    R.setAttribute('data-theme',t);
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0E1629':'#2B59E6');
    var bs=document.querySelectorAll('[data-theme-toggle]');
    for(var i=0;i<bs.length;i++){var b=bs[i];
      b.setAttribute('aria-pressed',t==='dark'?'true':'false');
      b.setAttribute('aria-label',t==='dark'?'Включить светлую тему':'Включить тёмную тему');
      b.setAttribute('title',t==='dark'?'Включить светлую тему':'Включить тёмную тему');
      var s=b.querySelector('.theme-txt');if(s)s.textContent=t==='dark'?'Светлая':'Тёмная';}}
  set(saved()||DEFAULT||sys());
  if(MQ&&MQ.addEventListener)MQ.addEventListener('change',function(){if(!saved()&&!DEFAULT)set(sys());});
  document.addEventListener('DOMContentLoaded',function(){set(R.getAttribute('data-theme'));});
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-theme-toggle]');if(!b)return;
    var n=R.getAttribute('data-theme')==='dark'?'light':'dark';
    try{localStorage.setItem(K,n);}catch(x){}
    set(n);});
})();
</script>
<title>Ментальная арифметика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@600;800&family=Rubik:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: тетрадный лист в клетку; одна колонка до 860px; карточки лежат на «бумаге», главная кнопка и жёлтый маркер — единственные яркие пятна. */
:root{
  --paper:#F3F6FC; --line:#D5DFF2; --card:#FFFFFF; --ink:#1A2747; --ink2:#51608A; --edge:#1A2747;
  --blue:#2B59E6; --on-blue:#FFFFFF; --blue-soft:#DDE7FF; --cell-a:#A9C0FF; --yellow:#FFD84A; --on-yellow:#1A2747;
  --dot2:#E58A00; --ok:#12805A; --ok-soft:#D7F2E5; --try:#B35A00; --try-soft:#FFEBD0; --mute:#E7ECF7; --c-red:#C62828; --c-blue:#2B59E6; --c-green:#12805A; --c-purple:#7B3FC4;
  --f-head:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1629; --line:#1B2849; --card:#17223F; --ink:#EAF0FF; --ink2:#A3B1D8; --edge:#8FA3D9;
  --blue:#86A3FF; --on-blue:#0E1629; --blue-soft:#243566; --cell-a:#5C7BE0; --yellow:#FFD84A; --on-yellow:#1A2747;
  --dot2:#FFB04D; --ok:#4ED69B; --ok-soft:#0F3A2B; --try:#FFB04D; --try-soft:#3B2A10; --mute:#1F2C50; --c-red:#FF7B72; --c-blue:#86A3FF; --c-green:#4ED69B; --c-purple:#C39BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1629; --line:#1B2849; --card:#17223F; --ink:#EAF0FF; --ink2:#A3B1D8; --edge:#8FA3D9;
  --blue:#86A3FF; --on-blue:#0E1629; --blue-soft:#243566; --cell-a:#5C7BE0; --yellow:#FFD84A; --on-yellow:#1A2747;
  --dot2:#FFB04D; --ok:#4ED69B; --ok-soft:#0F3A2B; --try:#FFB04D; --try-soft:#3B2A10; --mute:#1F2C50; --c-red:#FF7B72; --c-blue:#86A3FF; --c-green:#4ED69B; --c-purple:#C39BFF; color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font:600 18px/1.55 var(--f-body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6.5vw,46px)}
h2{font-size:clamp(22px,4.5vw,28px);margin:28px 0 12px}
h3{font-size:clamp(20px,4vw,24px)}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* шапка */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 6px}
.brand{font:700 20px var(--f-head);display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink)}
.brand i{width:30px;height:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border:2px solid var(--edge);border-radius:5px;background:var(--card)}
.brand i b{background:var(--cell-a);border-radius:1px}.brand i b:nth-child(5){background:var(--yellow)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:var(--card);border:2px solid transparent;border-radius:8px;padding:6px 12px;font:500 15px var(--f-head);min-height:40px}
.nav button[aria-current="page"]{border-color:var(--edge);background:var(--yellow);color:var(--on-yellow)}

/* карточки */
.card{background:var(--card);border:2px solid var(--edge);border-radius:8px;padding:clamp(16px,4vw,26px)}
.lift{box-shadow:4px 4px 0 var(--edge)}
.kicker{font:700 15px var(--f-hand);font-size:22px;color:var(--blue);margin:0 0 4px}
.lead{color:var(--ink2);max-width:62ch}
.mono{font-family:var(--f-head);font-weight:500}
.small{font-size:15px;color:var(--ink2)}

.btn{background:var(--blue);color:var(--on-blue);border:2px solid var(--edge);border-radius:8px;padding:10px 22px;min-height:48px;font:700 18px var(--f-head);box-shadow:0 3px 0 var(--edge)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* главная */
.today{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:18px;padding:14px 16px;background:var(--blue-soft);border:2px dashed var(--edge);border-radius:8px}
.today div{min-width:0;flex:1 1 240px}
.today b{display:block;font-family:var(--f-head)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:grid;gap:2px;text-align:left;background:var(--card);border:2px solid var(--edge);border-radius:8px;padding:14px 16px;min-width:0}
.mod:hover{background:var(--blue-soft)}
.mod-n{font:500 13px var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.mod-tag{font:700 24px var(--f-head);color:var(--blue)}
.mod-t{font:700 17px/1.25 var(--f-head)}
.mod-s{font-size:15px;color:var(--ink2)}
.mod.done .mod-s{color:var(--ok)}
.stars{letter-spacing:2px;color:var(--dot2)}

/* занятие */
.bar{display:flex;gap:4px;margin:10px 0 14px}
.bar i{flex:1;height:8px;border-radius:2px;background:var(--mute);border:1px solid var(--line)}
.bar i.on{background:var(--cell-a);border-color:var(--edge)}
.bar i.now{background:var(--yellow);border-color:var(--edge)}
.phase{font:500 13px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.goal{font:600 28px var(--f-head);color:var(--blue);margin:0 0 8px}
.demo{margin:16px 0;padding:14px;border:2px dashed var(--edge);border-radius:8px;background:var(--paper);display:grid;gap:14px;min-width:0}
.eq{font:700 clamp(34px,9vw,52px)/1.1 var(--f-head);font-variant-numeric:tabular-nums;margin:6px 0 14px;overflow-wrap:anywhere}
.eq.sm{font-size:clamp(20px,5vw,28px);margin:0}
.eq b{background:var(--yellow);color:var(--on-yellow);padding:0 .2em;border-radius:3px}
.ask-lead{font:700 20px var(--f-head);margin-bottom:4px}
.stps{display:flex;flex-wrap:wrap;gap:12px}
.stp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stp-l{font-size:15px;color:var(--ink2);margin-right:2px}
.stp-b{width:44px;height:44px;border:2px solid var(--edge);border-radius:8px;background:var(--card);font:700 22px var(--f-head)}
.stp-v{min-width:2ch;text-align:center;font:700 24px var(--f-head);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--edge);background:var(--card);border-radius:8px;padding:6px 12px;min-height:44px;font:700 16px var(--f-head)}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow)}

.rect{display:grid;grid-template-columns:repeat(var(--cols),var(--cs));gap:2px;--cs:22px;width:max-content;max-width:100%}
.rect i{width:var(--cs);height:var(--cs);background:var(--cell-a);border:1.5px solid var(--edge);border-radius:2px}
.rect i.c2{background:var(--yellow)}
.groups{display:flex;flex-wrap:wrap;gap:10px}
.grp{display:grid;grid-template-columns:repeat(var(--gc),var(--dot,14px));gap:4px;padding:6px;border:2px dashed var(--edge);border-radius:8px;background:var(--card)}
.grp b{width:var(--dot,14px);height:var(--dot,14px);border-radius:50%;background:var(--blue)}
.grp:nth-child(even) b{background:var(--dot2)}
.pair{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 16px var(--f-head);padding:4px 10px;border:2px solid var(--edge);border-radius:6px;background:var(--card);font-variant-numeric:tabular-nums}
.chip.hl{background:var(--yellow);color:var(--on-yellow)}
.chip.soft{background:var(--blue-soft)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:700 22px var(--f-head)}
.chain .op{font:600 15px var(--f-body);color:var(--ink2)}
.tile{display:inline-grid;place-items:center;width:52px;height:64px;border:2px solid var(--edge);border-radius:6px;background:var(--cell-a);font:700 36px var(--f-head);color:var(--ink)}
.tile.z{background:var(--yellow);color:var(--on-yellow)}
.read{margin:0;min-height:3.2em}
.meter{display:grid;gap:8px}
.meter div{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:10px;align-items:center;font-size:15px}
.meter span i{display:block;height:22px;background:var(--cell-a);border:2px solid var(--edge);border-radius:4px}
.meter div:last-child span i{background:var(--yellow)}

/* квадрат Пифагора */
.pyth{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px;max-width:560px;margin:0 auto}
.pyth.static{max-width:340px;margin:8px 0}
.pyth .ph,.pyth .p0{display:grid;place-items:center;font:700 clamp(10px,2.6vw,15px) var(--f-head);color:var(--blue);aspect-ratio:1}
.pc{aspect-ratio:1;padding:0;border:1px solid var(--edge);background:var(--card);color:var(--ink);font:500 clamp(9px,2.3vw,15px) var(--f-head);border-radius:2px;min-width:0;font-variant-numeric:tabular-nums}
.pc.rowc,.pc.colc{background:var(--blue-soft)}
.pc.dg{background:var(--cell-a)}
.pc.sel,.pc.mir{background:var(--yellow);color:var(--on-yellow);font-weight:700}
.pc.mir{outline:2px dashed var(--edge);outline-offset:-3px}
.pyth.static .pc{pointer-events:none}

/* пальцы */
.hands{display:flex;align-items:flex-end;justify-content:center;gap:6px;min-height:100px}
.fg{width:clamp(26px,8vw,42px);height:var(--h);border:2px solid var(--edge);border-radius:20px 20px 6px 6px;background:var(--cell-a);padding:0;display:grid;align-items:end;justify-items:center;color:var(--ink);transition:height .15s}
.fg span{font:700 13px var(--f-head);padding-bottom:3px}
.fg.fold{background:var(--yellow);color:var(--on-yellow)}
.fg:nth-child(5){margin-right:16px}

/* ответ */
.answer{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ans{width:7ch;max-width:100%;text-align:center;font:700 34px var(--f-head);padding:6px 8px;border:2px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.fb{margin-top:16px;padding:12px 14px;border:2px solid var(--edge);border-radius:8px;display:grid;gap:8px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.try{background:var(--try-soft);border-color:var(--try)}
.fb strong{font-family:var(--f-head)}
.hint{padding:12px;border-radius:6px;background:var(--card);border:2px dashed var(--edge)}
.hint p:last-child{margin-bottom:0}
.rest{margin-top:16px;padding:10px 14px;border-radius:8px;background:var(--blue-soft);font-size:15px}
.big-stars{font-size:44px;letter-spacing:6px;color:var(--dot2);line-height:1}

/* родителям */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid2>*{min-width:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;position:relative;margin-top:6px}
.week .band{position:absolute;left:0;right:0;bottom:calc(5/15*100px + 22px);height:calc(5/15*100px);background:var(--ok-soft);border-top:1px dashed var(--ok);border-bottom:1px dashed var(--ok);z-index:0}
.week div{position:relative;z-index:1;display:grid;justify-items:center;align-content:end;gap:4px;font-size:13px;color:var(--ink2);height:100%}
.week div i{display:block;width:100%;max-width:34px;background:var(--cell-a);border:2px solid var(--edge);border-radius:3px 3px 0 0;min-height:2px}
.week div.today-col i{background:var(--yellow)}
.map{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;max-width:420px}
.map i{aspect-ratio:1;display:grid;place-items:center;font:500 clamp(8px,2vw,12px) var(--f-head);border:1px solid var(--line);background:var(--mute);color:var(--ink2);font-style:normal}
.map i.k{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.map i.w{background:var(--try-soft);color:var(--try);border-color:var(--try)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border:1px solid var(--edge);background:var(--mute)}
.legend .k::before{background:var(--ok-soft);border-color:var(--ok)}.legend .w::before{background:var(--try-soft);border-color:var(--try)}
ul.tips{margin:0;padding-left:1.1em;display:grid;gap:6px}
.bars{display:grid;gap:8px}
.bars div{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}

.ex{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ex b{font-family:var(--f-head);color:var(--blue)}
.ex:last-child{border-bottom:0}
@media (max-width:440px){.ex{grid-template-columns:1fr;gap:2px}.rect{--cs:17px}.btn{width:100%}.today .btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* версия 2 */
.age{display:inline-grid;place-items:center;min-width:2.1em;padding:0 .35em;border:2px solid var(--edge);border-radius:6px;font:700 .7em var(--f-head);color:var(--ink);background:var(--yellow);color:var(--on-yellow);vertical-align:.15em;margin-left:.4em}
.expl{font:600 clamp(20px,4.6vw,24px)/1.5 var(--f-body);margin:10px 0 4px;max-width:56ch}
.expl.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.vcap{margin:0 0 4px}
.btn svg{flex:none}
.btn.alt{display:inline-flex;align-items:center;gap:8px}
.note{background:var(--card);border:2px solid var(--edge);border-radius:8px;padding:14px 16px;margin-bottom:14px;display:grid;gap:8px}
.note h3{font-size:19px}
.note p{margin:0}
.note.warn{background:var(--try-soft);border-color:var(--try)}
.note summary,details summary{cursor:pointer;font:500 16px var(--f-head);padding:6px 0}
details{margin-top:8px}
.ta{width:100%;max-width:100%;margin:8px 0;padding:10px;border:2px solid var(--edge);border-radius:8px;background:var(--paper);color:var(--ink);font:500 13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.sw{font:700 clamp(36px,10vw,56px)/1.1 var(--f-head);letter-spacing:.04em;margin:6px 0 12px}
.stroop .seg button{display:inline-flex;align-items:center;gap:8px}
.stroop .seg i{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge)}
.foot{max-width:860px;margin:36px auto 0;padding-top:16px;border-top:2px dashed var(--edge);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font:500 15px var(--f-head);color:var(--ink2)}
.foot a,.note a,.card a:not(.btn){color:var(--blue);text-underline-offset:3px}
.foot .age{margin:0;font-size:15px}
.doc{max-width:70ch;margin:0 auto}
.doc h1{font-size:clamp(26px,6vw,36px);margin:0 0 12px}
.doc h2{font-size:clamp(19px,4vw,23px);margin:24px 0 8px}
.doc p,.doc li{font-weight:600}
.doc ul{padding-left:1.2em;display:grid;gap:6px}
.draft{background:var(--try-soft);border:2px solid var(--try);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:15px}
mark.ph{background:var(--yellow);color:var(--on-yellow);padding:0 .2em;border-radius:3px}
.docpage{padding-top:16px}

/* продвинутый режим */
.adv-sw{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:4px 14px 4px 6px;min-height:40px;font:500 15px var(--f-head);color:var(--ink);cursor:pointer}
.adv-sw .knob{width:34px;height:22px;border-radius:999px;background:var(--mute);border:2px solid var(--edge);position:relative;flex:none;transition:background .15s}
.adv-sw .knob::after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--ink2);transition:transform .15s,background .15s}
.adv-sw[aria-checked="true"]{background:var(--yellow);color:var(--on-yellow)}
.adv-sw[aria-checked="true"] .knob{background:var(--blue)}
.adv-sw[aria-checked="true"] .knob::after{transform:translateX(12px);background:var(--yellow)}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{text-align:left;border:2px solid var(--edge);background:var(--card);border-radius:8px;padding:12px 14px;min-height:52px;font:700 18px var(--f-head);color:var(--ink)}
.opt:hover:not([disabled]){background:var(--blue-soft)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--try-soft);border-color:var(--try);opacity:.8}
.goal-list{display:grid;gap:8px;margin-top:10px}
.grow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:2px solid var(--edge);border-radius:8px;padding:10px 14px;min-height:52px;font:700 17px var(--f-head);color:var(--ink)}
.grow.done{background:var(--ok-soft);border-color:var(--ok)}
.grow .tick{width:28px;height:28px;border:2px solid var(--edge);border-radius:6px;display:grid;place-items:center;font-style:normal;flex:none;background:var(--card);color:var(--ok)}
.say{margin:14px 0;padding:12px 14px;border:2px solid var(--edge);border-radius:8px;background:var(--blue-soft);display:grid;gap:6px;justify-items:start}
.say p{margin:0}
.gcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.gc{aspect-ratio:1/1;border:2px solid var(--edge);border-radius:8px;background:var(--cell-a);font:700 clamp(15px,4.4vw,22px) var(--f-head);color:var(--ink);padding:2px;min-width:0;overflow-wrap:anywhere}
.gc.open{background:var(--card)}
.gc.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.nlc{min-width:2.6em;text-align:center;padding:6px 4px;border:2px solid var(--edge);border-radius:6px;background:var(--card);font:700 16px var(--f-head);font-variant-numeric:tabular-nums}
.nlc.on{background:var(--cell-a)}
.nlc.now{background:var(--yellow);color:var(--on-yellow)}
.step-n{margin:0 0 4px;font:500 14px var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin:8px 0}
.kc{aspect-ratio:1/1;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--mute);color:var(--ink2);font:500 clamp(10px,2.8vw,14px) var(--f-head);font-variant-numeric:tabular-nums;min-width:0}
.kc.on{background:var(--cell-a);border:2px solid var(--edge);color:var(--ink);font-weight:700}
.kc.now{background:var(--yellow);border:2px solid var(--edge);color:var(--on-yellow);font-weight:700}

/* ---- продвинутый режим, этап 2 ---- */
.hero{display:block;margin:0 0 8px}
.hero .a{fill:var(--cell-a);stroke:var(--edge);stroke-width:2}
.hero .b{fill:var(--blue);stroke:var(--edge);stroke-width:2}
.hero .c{fill:var(--yellow);stroke:var(--edge);stroke-width:2}
.hero .g{fill:var(--ok);stroke:var(--edge);stroke-width:2}
.hero .k{fill:var(--edge);stroke:none}
.hero .l{fill:none;stroke:var(--edge);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hero text{font:700 16px var(--f-head);fill:var(--ink)}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.stk{display:grid;justify-items:center;gap:4px;text-align:center;padding:14px 8px;border:2px dashed var(--edge);border-radius:8px;background:var(--paper);opacity:.55}
.stk.got{opacity:1;border-style:solid;background:var(--card)}
.stk:not(.got) .hero{filter:grayscale(1)}
.stk-note{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px 12px;border:2px solid var(--edge);border-radius:8px;background:var(--blue-soft)}
.stk-note .hero{margin:0;flex:none}
.coins{display:flex;flex-wrap:wrap;gap:6px}
.clock{max-width:100%;height:auto}
.cmp{margin-top:10px;padding:10px 12px;border:2px solid var(--edge);border-radius:8px;background:var(--paper)}
.cmp p{margin:6px 0}
.cmp .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.cmp .mono{font:700 18px var(--f-head)}
.tip{margin-top:10px;padding:10px 12px;border-left:6px solid var(--yellow);background:var(--paper);border-radius:4px}
.linkb{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;min-height:0}

/* ---- тарифы в приложении ---- */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.plan{border:2px solid var(--edge);border-radius:10px;background:var(--card);padding:16px;display:grid;gap:10px;align-content:start;box-shadow:0 4px 0 var(--edge)}
.plan.pro{background:var(--blue-soft)}
.plan h3{margin:0}
.plan .price{margin:0;font:700 30px var(--f-head);color:var(--blue)}
.plan ul{margin:0;padding-left:20px;display:grid;gap:4px}
.plan .btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

/* ---- навигация-ссылки, блог, CTA ---- */
.nav a{display:inline-flex;align-items:center;background:var(--card);border:2px solid transparent;border-radius:8px;padding:6px 12px;font:500 15px var(--f-head);min-height:40px;color:var(--ink);text-decoration:none}
.nav a:hover{border-color:var(--edge)}
.lp-nav{display:flex;gap:18px;flex-wrap:wrap}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:18px 0}
.post-card{border:2px solid var(--edge);border-radius:10px;background:var(--paper);padding:16px;display:grid;gap:8px;align-content:start}
.post-card h2{font-size:21px;margin:0}
.post-card h2 a{color:var(--ink);text-decoration:none}
.post-card h2 a:hover{text-decoration:underline}
.post-card p{margin:0}
.post-card .btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;justify-self:start}
.post-meta{font-size:15px;color:var(--ink2)}
.crumbs{font-size:15px;color:var(--ink2);margin-bottom:8px}
.cta{border:2px solid var(--edge);border-radius:10px;background:var(--blue-soft);padding:16px;margin:18px 0;display:grid;gap:12px;justify-items:start}
.cta p{margin:0;font-weight:800}
.cta .btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.related{display:grid;gap:6px;padding-left:20px}

/* ---- переключатель темы ---- */
.theme-sw{display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;background:var(--card);border:2px solid var(--edge);border-radius:50%;color:var(--ink)}
.theme-sw svg{width:22px;height:22px;flex:none}
.theme-sw .theme-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.theme-sw .ic-sun{display:none}
:root[data-theme="dark"] .theme-sw .ic-sun{display:block}
:root[data-theme="dark"] .theme-sw .ic-moon{display:none}

/* ---- сенсорные экраны: крупные области нажатия ---- */
button,.btn,summary,.opt,.mod,.grow,.nav a,label.btn{touch-action:manipulation;-webkit-tap-highlight-color:rgba(43,89,230,.22)}
.brand{min-height:44px}
summary{padding-block:10px;min-height:44px}
.foot a,.lp-foot a,.lp-nav a,.crumbs a,.related a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.foot,.lp-foot{gap:0 10px}
.linkb{padding:10px 4px}
@media (max-width:440px){.answer .btn{width:auto}}

/* ---- иллюстрации в блоге ---- */
.post-fig{margin:14px 0 18px}
.post-fig img{display:block;width:100%;height:auto;aspect-ratio:1200/630;border-radius:16px;border:2px solid var(--edge);background:var(--card)}
.post-card .thumb{display:block;margin:-4px -4px 12px}
.post-card .thumb img{display:block;width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;border-radius:12px}
.small a{display:inline-block;padding:12px 4px;min-height:44px;box-sizing:border-box}

/* ---- «Показать визуально» ---- */
.vis-panel{margin-top:14px;padding:16px;border:2px solid var(--edge);border-radius:16px;background:var(--card);display:grid;gap:12px}
.vis-t{margin:0;font:800 18px var(--f-head);color:var(--blue)}
.vis-baskets{display:flex;flex-wrap:wrap;gap:12px}
.vbk{display:grid;gap:0;justify-items:center}
.vfs{display:grid;grid-template-columns:repeat(var(--vc,5),26px);justify-content:center;gap:2px;padding:4px 4px 0;margin-bottom:-6px;position:relative;z-index:0}
.vfs .vf{width:26px;height:26px}
.vf{display:block}.vf-i{display:inline-block;width:20px;height:20px;vertical-align:-4px}
.vb{width:100%;min-width:78px;height:34px;background:#C98A3D;border-radius:4px 4px 16px 16px;display:grid;place-items:center;position:relative;color:#fff;font:800 16px var(--f-head);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.vb{z-index:1}
.vempty{margin-bottom:0;min-height:56px;place-items:center;color:var(--ink-soft,var(--ink));font:800 26px var(--f-head);display:grid}
.vis-pile{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:12px;background:var(--mute)}
.vis-pile .vfs{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:2px;padding:0;margin:0}.vtot{font:800 16px var(--f-head)}
.vis-x{margin:0}.vis-eq{margin:0;font:700 20px var(--f-head)}.vis-eq b{color:var(--ok)}
.vis-next{justify-self:start}
@media (max-width:440px){.vfs{grid-template-columns:repeat(var(--vc,5),22px);margin-bottom:-5px}.vfs .vf{width:22px;height:22px}.vb{min-width:66px}}

/* ---- картинки блоков ---- */
.modart{display:block;flex:none;align-self:start;width:calc(100% + 32px);max-width:none;margin:-14px -16px 10px;height:auto;aspect-ratio:300/120;border-radius:6px 6px 0 0;overflow:hidden}
.mod{overflow:hidden}
.card .modart{width:100%;margin:0 0 12px;border-radius:14px;max-height:170px}

/* ===== Устный счёт ===== */
.mviz{display:block;width:100%;max-width:420px;height:auto;margin:8px 0}
.mviz.mviz-s{width:auto;max-width:100%;max-height:96px;min-width:60px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0}
.mop{font:700 28px var(--f-head);color:var(--ink)}
.mv-b{fill:var(--blue);stroke:var(--edge);stroke-width:1.5}
.mv-b2{fill:var(--cell-a);stroke:var(--edge);stroke-width:1.5}
.mv-y{fill:var(--yellow);stroke:var(--edge);stroke-width:1.5}
.mv-g{fill:var(--mute,#E6ECF8);stroke:var(--line);stroke-width:1.5}
.mv-x{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:3 3;opacity:.7}
.mv-t{fill:var(--ink);font:700 15px var(--f-head)}
.mv-t2{fill:var(--ink2);font:600 12px var(--f-head)}
.mv-t3{fill:var(--ink);font:700 20px var(--f-head)}
.mv-l{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.mv-a0,.mv-a1{fill:none;stroke-width:3;stroke-linecap:round}
.mv-a0{stroke:var(--blue)}
.mv-a1{stroke:var(--ink2)}
.mart{display:block}
.nav .nav-ment{font-weight:700}
.mnav-cur{border-color:var(--edge)!important;background:var(--yellow)!important;color:var(--on-yellow)!important}
.lp-ment{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

/* ===== Тарифы: Умножение / Устный счёт / Комбо ===== */
.tcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px;align-items:stretch;margin:22px 0 14px}
.lp .tcols,.tcols.wide{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
.lp .tcol,.tcols.wide .tcol{padding:14px}.lp .tcol h3{font-size:19px}.lp .tcol .tprice{font-size:28px}
.tcol{position:relative;border:2px solid var(--edge);border-radius:12px;background:var(--card);padding:18px;display:grid;gap:10px;grid-template-rows:auto auto auto 1fr auto;box-shadow:0 5px 0 var(--edge)}
.tcol h3{margin:0;font-size:22px}
.tcol .tprice{margin:0;font:700 32px var(--f-head);color:var(--blue)}
.tcol .tsub{margin:0;font-size:15px;font-weight:700}
.tcol ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;align-content:start}
.tcol li{padding-left:26px;position:relative;font-size:15px;line-height:1.4}
.tcol li::before{content:'✓';position:absolute;left:0;font-weight:800;color:var(--ok)}
.tcol .tact{display:grid;gap:8px;border-top:2px dashed var(--line);padding-top:12px}
.tcol .tact .btn{text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.tcol.free{background:var(--bg-soft,var(--card))}
.tcol.combo{background:var(--blue-soft);border-color:var(--blue);border-width:3px;box-shadow:0 6px 0 var(--blue),0 0 0 4px var(--yellow);transform:translateY(-6px)}
.tcol.combo .tact .btn.big{background:var(--yellow);color:var(--on-yellow);border-color:var(--edge);font-size:19px;padding:14px 18px}
.tbadge{position:absolute;top:-16px;right:14px;background:var(--yellow);color:var(--on-yellow);border:2px solid var(--edge);border-radius:999px;padding:3px 14px;font:800 15px var(--f-head)}
@media(max-width:1100px){.lp .tcols,.tcols.wide{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.lp .tcols,.tcols.wide{grid-template-columns:repeat(2,minmax(0,1fr))}.tcol.combo{grid-column:1/-1}}
@media(max-width:620px){.tcols,.lp .tcols,.tcols.wide{grid-template-columns:1fr;gap:26px}.tcol.combo{transform:none;order:-1;margin-top:10px}}

/* ===== Маскот «Клетик» ===== */
.clk{display:block;width:100%;height:auto;overflow:visible}
.clk .cb{fill:var(--blue);stroke:var(--edge);stroke-width:3}
.clk .cg{fill:none;stroke:#fff;stroke-opacity:.28;stroke-width:2}
.clk-corner{display:flex;justify-content:flex-end;margin:4px 0 -8px}
.clk-corner .clk{width:76px}
.clk-top{float:right;width:84px;margin:0 0 6px 12px}
.clk-hi{display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;flex:none}
.clk-hi i{font:700 13px/1.2 var(--f-head);font-style:normal;text-align:center;color:var(--ink2)}
.fb.hc{position:relative;margin-top:44px;padding-right:84px;min-height:64px}
.fb.hc>.clk{position:absolute;right:10px;top:-36px;width:66px;animation:clkpop .35s ease-out}
@keyframes clkpop{from{transform:scale(.3) translateY(14px);opacity:0}70%{transform:scale(1.08)}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.fb.hc>.clk{animation:none}}
.lp-hi{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.lp-hi .clk{width:104px;flex:none}
.clk-bubble{position:relative;margin:0;padding:10px 14px;background:var(--card);border:2px solid var(--edge);border-radius:14px;font:700 16px/1.35 var(--f-head);max-width:34ch}
.clk-bubble::before{content:'';position:absolute;left:-9px;top:50%;margin-top:-8px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--edge);border-bottom:2px solid var(--edge);transform:rotate(45deg)}
.lp-guide{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.lp-guide .clk{width:92px;flex:none}

/* «Устный счёт»: схемы всегда яркие на светлой подложке, в любой теме */
.mviz{background:#F4F7FF;border:2px solid #C9D6F5;border-radius:14px;padding:6px 8px}
.mv-b{fill:#2B59E6;stroke:#1A2747;stroke-width:1.5}
.mv-b2{fill:#86A3FF;stroke:#1A2747;stroke-width:1.5}
.mv-y{fill:#FFC83D;stroke:#1A2747;stroke-width:1.5}
.mv-g{fill:#E3EAFB;stroke:#B5C4EC;stroke-width:1.5}
.mv-x{fill:#FFE3E3;stroke:#E5383B;stroke-width:1.8;stroke-dasharray:4 3;opacity:1}
.mv-t{fill:#1A2747}.mv-t2{fill:#51608A}.mv-t3{fill:#1A2747}
.mv-l{stroke:#1A2747}.mv-a0{stroke:#2B59E6}.mv-a1{stroke:#FF8A4C}
.mv-fr{fill:#FFFFFF;stroke:#2B59E6;stroke-width:2}
.mv-em{fill:#FFF3C4;stroke:#F0A91E;stroke-width:2;stroke-dasharray:5 4}
.mv-q{font:800 26px var(--f-head);fill:#E08A00}
.mv-ap{fill:#E5383B;stroke:#9B1C1F;stroke-width:1.5}
.mv-lf{fill:#3DBE7A}
.mv-st{fill:none;stroke:#6B3F1D;stroke-width:2.4;stroke-linecap:round}
.mv-hl{fill:#fff;opacity:.55}
.modart .mv-t,.modart .mv-t2,.modart .mv-t3{fill:#fff}
.modart .mv-l{stroke:#fff}.modart .mv-a0{stroke:#FFC83D}.modart .mv-a1{stroke:#fff}
.modart .mv-b{fill:#FFC83D;stroke:#fff}
/* превью игр */
.gart{display:block;width:calc(100% + 32px);max-width:none;margin:-14px -16px 10px;height:auto;aspect-ratio:300/120;border-radius:6px 6px 0 0}
.mchip{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;padding:0 10px;border-radius:12px;border:2px solid #1A2747;font:800 22px var(--f-head);box-shadow:0 3px 0 #1A2747}
.mchip.t{background:#2B59E6;color:#fff}.mchip.u{background:#FF8A4C;color:#1A2747}.mchip.y{background:#FFC83D;color:#1A2747}
.mviz.mviz-s{max-height:170px}

/* фрукты в объяснениях «Устного счёта» (цвета фиксированные) */
.mv-or{fill:#7CC443;stroke:#1A2747;stroke-width:1.3}
.mv-crate{fill:#FFF3D6;stroke:#B9822B;stroke-width:1.6}
.mv-crx{fill:none;stroke:#E5383B;stroke-width:1.4;stroke-dasharray:4 3}
.mviz .mv-x{fill:#FFF;stroke:#E5383B;stroke-width:1.2;stroke-dasharray:2.5 2;opacity:.85}

.eq.exq{font-size:clamp(30px,8vw,44px);margin:2px 0 10px}

/* цели на сегодня: одна строка с кольцами прогресса */
.goals-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;margin-top:14px}
.goals-row h3{margin:0;font-size:17px;white-space:nowrap}
.goals-row .goal-list{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.goals-row .grow{min-height:40px;padding:6px 12px 6px 8px;gap:8px;font-size:15px;border-radius:999px}
.gring{flex:none}.gr-bg{fill:none;stroke:var(--line);stroke-width:3.4}.gr-fg{fill:none;stroke:var(--blue);stroke-width:3.4;stroke-linecap:round}
.gr-ok{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.grow.done .gr-fg{stroke:var(--ok)}

/* ---------- «Быстрый счёт по Трахтенбергу»: лента с цифрами ---------- */
.tz{display:grid;grid-template-columns:repeat(var(--n),minmax(0,56px));gap:4px;justify-content:center;background:#fff;border:2px solid #C9D6F5;border-radius:14px;padding:10px 8px;margin:8px 0 12px;color:#1A2747}
.tz>span{display:flex;align-items:center;justify-content:center;min-height:20px;font:700 14px/1 var(--f-head)}
.tz>.tz-c{color:#C2255C;min-height:22px}
.tz>.tz-d{min-height:50px;font-size:28px;border:2px solid #1A2747;border-radius:10px;background:#fff}
.tz>.tz-d.tz-e{border:2px dashed #C9D6F5;background:transparent}
.tz>.tz-d.tz-z{background:#EEF2FA;color:#6B7A99;border-color:#9AA8C7}
.tz>.tz-d.tz-g{border-style:dashed}
.tz>.tz-d.now{background:#2B59E6;color:#fff;border-color:#1A2747}
.tz>.tz-d.nb{background:#FF8A4C;color:#1A2747;border-color:#1A2747}
.tz>.tz-l{font-size:11px;min-height:16px;color:#4B5B7C}
.tz>.tz-a{min-height:50px;font-size:28px;border-radius:10px;border:2px dashed #C9D6F5}
.tz>.tz-a.ok{background:#D8F5E3;color:#146C3D;border:2px solid #2E9E5B}
.tz>.tz-a.q{border:2px solid #2B59E6;color:#2B59E6;background:#EEF3FF}
.tz-leg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tz-key{padding:3px 10px;border-radius:999px;border:2px solid #1A2747;font:700 13px var(--f-head);background:#fff;color:#1A2747}
.tz-key.now{background:#2B59E6;color:#fff}.tz-key.nb{background:#FF8A4C}.tz-key.z{background:#EEF2FA;color:#6B7A99}.tz-key.a{background:#D8F5E3;color:#146C3D;border-color:#2E9E5B}
.tz-scroll{overflow-x:auto;margin:8px 0}
.tz-tab{width:100%;border-collapse:collapse;font-size:15px}
.tz-tab th,.tz-tab td{padding:6px 8px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.gp{margin:4px 0 10px;font-size:18px}.gp p{margin:0 0 4px}
.answer.choice{display:flex;flex-wrap:wrap;gap:10px}
/* ментальная арифметика: абакус */
.abk-wrap{display:flex;justify-content:center;margin:8px 0 12px;background:#fff;border:2px solid #C9D6F5;border-radius:14px;padding:8px;overflow-x:auto}
.abk{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none}
.abk-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.abk-row figure{margin:0;text-align:center;background:#fff;border:2px solid #C9D6F5;border-radius:12px;padding:6px;max-width:120px}
.abk-row figcaption{font:700 13px var(--f-head);color:#1A2747}
.flb{min-height:170px;display:flex;align-items:center;justify-content:center;margin:8px 0}
.flcover{display:flex;align-items:center;justify-content:center;min-height:150px;width:100%;max-width:520px;border:3px dashed #9AA8C7;border-radius:16px;background:#EEF2FA;color:#4B5B7C;font:800 34px var(--f-head);text-align:center;padding:10px}

/* ---------- хранение ---------- */
function fresh(){return {app:'abakus',schemaVersion:1,done:{},stars:{},stats:{},sr:{},rec:{},days:{},alts:{},tier:'free',onboarded:false};}
var M=fresh(),mainTier='free',mainMult='free',mainMental='free',mainTrach='free',storage={mode:'init'};
var Store=(function(){
  var DB='tablica',ST='kv',dbp=null;
  function open(){return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('IndexedDB недоступен'));return;}
    var r;try{r=indexedDB.open(DB,1);}catch(e){rej(e);return;}
    r.onupgradeneeded=function(){r.result.createObjectStore(ST);};
    r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.onblocked=function(){rej(new Error('blocked'));};});}
  function db(){return dbp||(dbp=open());}
  return {
    get:function(k){return db().then(function(d){return new Promise(function(res,rej){var q=d.transaction(ST,'readonly').objectStore(ST).get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});});},
    put:function(k,v){return db().then(function(d){return new Promise(function(res,rej){var tx=d.transaction(ST,'readwrite');tx.objectStore(ST).put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error||new Error('abort'));};});});}
  };})();
function adopt(o){var f=fresh();for(var k in f){if(o&&o[k]!==undefined&&o[k]!==null)f[k]=o[k];}
  ['done','stars','stats','sr','rec','days','alts'].forEach(function(k){if(!f[k]||typeof f[k]!=='object'||Array.isArray(f[k]))f[k]={};});
  if(RANK[f.tier]===undefined)f.tier='free';f.app='abakus';f.schemaVersion=1;return f;}
var saveT=null;
function flush(){saveT=null;if(storage.mode!=='idb')return;Store.put('abak',JSON.parse(JSON.stringify(M))).catch(function(){storage.mode='memory';});}
function save(){if(saveT)return;saveT=setTimeout(flush,250);}
document.addEventListener('visibilitychange',function(){if(document.hidden){if(saveT)clearTimeout(saveT);flush();}});

/* ---------- виртуальный абакус ---------- */
var RODN=['единиц','десятков','сотен','тысяч','десятков тысяч'],RODS=['ед.','дес.','сот.','тыс.','д. тыс.'];
function rodName(i,len){return RODN[len-1-i]||'';}
var AC={hv:'#E8590C',hv2:'#F6C2A0',ev:'#2B59E6',ev2:'#B6C6F7',wood:'#C98A4B',wd:'#6B4423'};
function bead(cx,cy,col,at){
  return '<polygon points="'+(cx-23)+','+cy+' '+(cx-11)+','+(cy-11)+' '+(cx+11)+','+(cy-11)+' '+(cx+23)+','+cy+' '+(cx+11)+','+(cy+11)+' '+(cx-11)+','+(cy+11)+'" fill="'+col+'" stroke="#1A2747" stroke-width="2"'+at+'/>';}
/* v: массив цифр слева направо, o: {edit, num, labels, hl, w} */
function abacus(v,o){
  o=o||{};var n=v.length,RW=58,W=n*RW+16,H=204,i,j,s='';
  var bw=' style="max-width:'+(o.w||Math.round(W*1.2))+'px"';
  s+='<svg class="abk" viewBox="0 0 '+W+' '+(H+(o.num===false?8:44))+'"'+bw+' role="img" aria-label="Абакус: '+aval(v)+'" focusable="false">';
  s+='<rect x="2" y="2" width="'+(W-4)+'" height="'+(H-4)+'" rx="14" fill="'+AC.wood+'" stroke="'+AC.wd+'" stroke-width="4"/>';
  for(i=0;i<n;i++){
    var cx=8+RW*i+RW/2,x=v[i],h=x>=5?1:0,e=x%5;
    if(o.hl===i)s+='<rect x="'+(cx-27)+'" y="8" width="54" height="'+(H-16)+'" rx="10" fill="#FFE066" opacity=".55"/>';
    s+='<line x1="'+cx+'" y1="10" x2="'+cx+'" y2="'+(H-10)+'" stroke="#3b2a14" stroke-width="3"/>';}
  s+='<rect x="6" y="72" width="'+(W-12)+'" height="12" fill="'+AC.wd+'"/>';
  for(i=0;i<n;i++){
    var c=8+RW*i+RW/2,xx=v[i],hh=xx>=5?1:0,ee=xx%5,dr=o.edit?(' data-ar="'+i+'" data-ab="h" style="cursor:pointer"'):'',cy;
    cy=hh?58:28;s+='<g'+dr+'>'+(o.edit?'<rect x="'+(c-27)+'" y="'+(cy-15)+'" width="54" height="30" fill="transparent"/>':'')+bead(c,cy,hh?AC.hv:AC.hv2,'')+'</g>';
    for(j=1;j<=4;j++){
      cy=j<=ee?(97+23*(j-1)):(H-16-23*(4-j));
      dr=o.edit?(' data-ar="'+i+'" data-ab="'+j+'" style="cursor:pointer"'):'';
      s+='<g'+dr+'>'+(o.edit?'<rect x="'+(c-27)+'" y="'+(cy-12)+'" width="54" height="24" fill="transparent"/>':'')+bead(c,cy,j<=ee?AC.ev:AC.ev2,'')+'</g>';}
    if(o.num!==false)s+='<text x="'+c+'" y="'+(H+26)+'" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="700" font-size="26" fill="#1A2747">'+xx+'</text>';
    if(o.labels&&RODS[n-1-i])s+='<text x="'+c+'" y="'+(H+(o.num===false?-1:40))+'" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="600" font-size="11" fill="#4B5B7C">'+(o.num===false?'':RODS[n-1-i])+'</text>';}
  return s+'</svg>';}
/* живой абакус: касание бусины двигает её */
function mountAbacus(host,v,o,cb){
  o=o||{};o.edit=true;
  function paint(){host.innerHTML='<div class="abk-wrap">'+abacus(v,o)+'</div>';}
  host.onclick=function(e){
    var t=e.target.closest&&e.target.closest('[data-ar]');if(!t||host._lock)return;
    var i=+t.getAttribute('data-ar'),b=t.getAttribute('data-ab'),x=v[i],h=x>=5?1:0,ee=x%5;
    if(b==='h')h=h?0:1;else{b=+b;ee=(b<=ee)?b-1:b;}
    v[i]=h*5+ee;paint();if(cb)cb(v);};
  host._set=function(nv){var k;for(k=0;k<v.length;k++)v[k]=nv[k];paint();};
  paint();return host;}
function abStatic(v,o){o=o||{};return '<div class="abk-wrap">'+abacus(v,o)+'</div>';}
function miniRow(list){return '<div class="abk-row">'+list.map(function(x){return '<figure>'+abacus(x.v,{num:false,w:70})+'<figcaption>'+x.t+'</figcaption></figure>';}).join('')+'</div>';}

/*AENGINE*/
/* Абакус соробан: у стержня одна верхняя бусина (5) и четыре нижние (по 1). Стержни слева направо: старший разряд первым. */
function aval(v){var n=0,i;for(i=0;i<v.length;i++)n=n*10+v[i];return n;}
function afrom(n,len){var s=String(n),a=[],i;while(s.length<len)s='0'+s;for(i=0;i<s.length;i++)a.push(+s[i]);return a;}
function ah(x){return x>=5?1:0;}function ae(x){return x%5;}
/* один шаг руками: delta в {±1..±4, ±5} на одном стержне */
function aact(v,i,dl,acts){v[i]+=dl;acts.push({rod:i,delta:dl});}
function addIn(v,i,c,acts){ /* v[i]+c<=9, без переноса */

function subIn(v,i,c,acts){ /* v[i]>=c, без займа */

function aadd(v,i,d,ops){ /* прибавить цифру d на стержне i, перенос влево */

/* вся операция A ± B: цифры B слева направо */
function aplan(a,b,sign,len){

/* плоский список физических действий с состоянием после каждого */
function aflat(plan){

    var n0=out.length;
    function run(op,inPre){

      op.acts.forEach(function(a){v[a.rod]+=a.delta;out.push({top:top,op:op,pre:!!inPre,rod:a.rod,delta:a.delta,after:v.slice(),first:false});});}

/* какой способ нужен для одной цифры: 'direct' | 'bro' | 'fri' */
function aclass(x,d,sign){var v=[sign==='+'?0:1,x],ops=[];try{if(sign==='+')aadd(v,1,d,ops);else asub(v,1,d,ops);}catch(e){return null;}return ops[ops.length-1].way;}
/*AENDENGINE*/
function digsN(n){return String(n).split('').map(Number);}

/* ---------- типы примеров ---------- */
var TYPES={set1:{name:'Набрать цифру'},rd1:{name:'Прочитать цифру'},set2:{name:'Набрать число до 99'},rd2:{name:'Прочитать число до 99'},set4:{name:'Набрать число до 9999'},rd4:{name:'Прочитать число до 9999'},

  add2:{name:'Сложение двузначных'},sub2:{name:'Вычитание двузначных'},flash:{name:'Образ абакуса'},seq:{name:'Цепочка в уме'},mix:{name:'Счёт в уме'}};

function pl(n,o,f,m){n=Math.abs(n)%100;var d=n%10;if(n>10&&n<20)return m;if(d===1)return o;if(d>=2&&d<=4)return f;return m;}

/* ---------- генераторы примеров ---------- */
function rnd(lo,hi){return ri(lo,hi);}
function numN(k){var lo=k===1?1:Math.pow(10,k-1),hi=Math.pow(10,k)-1;return ri(lo,hi);}
function exSet(k){var N=numN(k);return {type:'set'+k,N:N,k:k,key:'set'+k+'-'+N};}
function exRd(k){var N=numN(k);return {type:'rd'+k,N:N,k:k,key:'rd'+k+'-'+N};}
var CLASS_OF={addS:['+','direct'],addB:['+','bro'],addF:['+','fri'],subS:['-','direct'],subB:['-','bro'],subF:['-','fri']};
function exOp(t){
  var c=CLASS_OF[t],sign=c[0],cls=c[1],x,d,t0=0,a,b;
  do{
    if(cls==='fri'&&sign==='+'){x=ri(1,9);d=ri(2,9);if(x+d<10)continue;}
    else if(cls==='fri'){x=ri(0,8);d=ri(x+1,9);}
    else{x=ri(1,9);d=ri(1,9);if(sign==='+'&&x+d>9)continue;if(sign==='-'&&x<d)continue;}
    t0++;
  }while(aclass(x,d,sign)!==cls&&t0<400);
  if(cls==='fri'&&sign==='-'){a=10+x;b=d;}else{a=x;b=d;}
  return {type:t,a:a,b:b,s:sign==='+'?'+':'−',key:t+'-'+a+'-'+b};}
function exAdd2(){var a=ri(11,89),b=ri(2,89),s=Math.random()<0.5?'+':'−';if(s==='−'){if(b>=a)b=ri(2,a-1);}
  return {type:s==='+'?'add2':'sub2',a:a,b:b,s:s,key:'t2-'+a+s+b};}
function exFlash(){var N=pick([numN(2),numN(3)]);return {type:'flash',N:N,key:'fl-'+N};}
function exSeq(){var n=ri(4,5),a=[ri(1,9)],run=a[0],i;for(i=1;i<n;i++){var v;do{v=ri(1,9);if(Math.random()<0.4)v=-v;}while(run+v<0||run+v>25);a.push(v);run+=v;}
  return {type:'seq',a:a,key:'sq-'+a.join(',')};}
function exMix(){var e=exAdd2();e.type='mix';e.key='mx-'+e.a+e.s+e.b;return e;}
var GEN={set1:function(){return exSet(1);},set2:function(){return exSet(2);},set4:function(){return exSet(4);},rd1:function(){return exRd(1);},rd2:function(){return exRd(2);},rd4:function(){return exRd(4);},
  addS:function(){return exOp('addS');},subS:function(){return exOp('subS');},addB:function(){return exOp('addB');},subB:function(){return exOp('subB');},addF:function(){return exOp('addF');},subF:function(){return exOp('subF');},
  add2:function(){var e=exAdd2();while(e.s!=='+')e=exAdd2();return e;},sub2:function(){var e=exAdd2();while(e.s!=='−')e=exAdd2();return e;},flash:exFlash,seq:exSeq,mix:exMix};

/* ---------- ответы и пояснения ---------- */

function planOf(e){var len=lenFor(e.a,e.b,e.s==='+'?e.a+e.b:e.a);return aplan(e.a,e.b,e.s==='+'?'+':'-',len);}
function opText(op,len){
  var d=op.d,nm=rodName(op.rod,len),pre=op.t==='+'?'+':'−';
  if(op.t==='+'){
    if(op.way==='direct')return d<=4?'Прибавляем '+d+' на стержне '+nm+'. Поднимаем '+d+' нижних бусин.':'Прибавляем '+d+' = 5'+(d>5?' + '+(d-5):'')+' на стержне '+nm+'. Опускаем верхнюю бусину'+(d>5?' и поднимаем '+(d-5)+' нижних':'')+'.';
    if(op.way==='bro')return 'Нижних бусин не хватает. Помощь брата: +'+d+' = +5 − '+(5-d)+'. На стержне '+nm+' опускаем верхнюю бусину и убираем '+(5-d)+' нижних.';
    return 'Не помещается. Помощь друга: +'+d+' = +10 − '+(10-d)+'. Прибавляем 1 на стержне слева (это 10) и на стержне '+nm+' убираем '+(10-d)+'.';}
  if(op.way==='direct')return d<=4?'Вычитаем '+d+' на стержне '+nm+'. Опускаем '+d+' нижних бусин.':'Вычитаем '+d+' = 5'+(d>5?' + '+(d-5):'')+' на стержне '+nm+'. Поднимаем верхнюю бусину'+(d>5?' и опускаем '+(d-5)+' нижних':'')+'.';
  if(op.way==='bro')return 'Нижних бусин не хватает. Помощь брата: −'+d+' = −5 + '+(5-d)+'. На стержне '+nm+' поднимаем верхнюю бусину и поднимаем к перекладине '+(5-d)+' нижних.';

function planLines(e){var p=planOf(e),len=p.start.length;return p.ops.map(function(op,i){return (i+1)+') '+opText(op,len);});}
function actPrompt(f,len){

function mkQ(e){

function explain(e,vi,it){

function headFor(it){return R.mode==='lesson'?barHtml()+'<div class="phase">'+it.phase+'</div>':'<div class="phase">'+(R.mode==='train'?'Тренажёр '+(R.i+1)+' из '+R.items.length:'')+'</div>';}
function rAsk(it){
  var q=it.q;q.first=true;var t0=Date.now(),isAb=q.mode==='abacus',isFl=q.type==='flash',isSq=q.type==='seq',vals=isAb?q.start.slice():null;
  var card=h('<section class="card lift"></section>'),shown=0;
  var vis=isAb?'<div id="abx"></div>':(q.show&&!isFl?'<div id="abs">'+abStatic(q.show,{labels:true})+'</div>':(isFl||isSq?'<div id="flb" class="flb"></div>':''));
  var ansUi=isAb?'<div class="answer"><button type="button" class="btn" id="chk">Готово</button></div>':'<div class="answer"><input class="ans" id="ans" type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]*" autocomplete="off" aria-label="Твой ответ"><button type="button" class="btn" id="chk">Проверить</button></div>';
  card.innerHTML=headFor(it)+'<p class="ask-lead">'+q.lead+'</p><div class="eq'+(q.eq.length>14?' sm':'')+'">'+q.eq+'</div>'+vis+ansUi+'<div id="fb" aria-live="polite"></div><div class="row" style="margin-top:14px"></div>';
  app.appendChild(card);
  var inp=$('#ans',card),chk=$('#chk',card),fb=$('#fb',card),rw=$('.row',card),host=$('#abx',card),flb=$('#flb',card),showBtn=null,replay=null;
  if(isAb)mountAbacus(host,vals,{labels:true});
  if(inp&&!isFl&&!isSq)inp.focus({preventScroll:true});
  function next(){R.i++;render();window.scrollTo(0,0);}
  function addShow(){if(showBtn||it.test)return;showBtn=h('<button type="button" class="btn ghost">Покажи решение по шагам</button>');showBtn.onclick=function(){fb.insertAdjacentHTML('beforeend',stepsHtml(q));showBtn.remove();};rw.appendChild(showBtn);}
  /* вспышка и цепочка */
  function setInput(on){if(inp){inp.disabled=!on;chk.disabled=!on;if(on)inp.focus({preventScroll:true});}}
  function runFlash(){
    setInput(false);flb.innerHTML=abStatic(q.show,{labels:true});
    later(function(){flb.innerHTML='<div class="flcover" aria-live="polite">?</div>';setInput(true);if(!it.test&&shown<2&&!replay){replay=h('<button type="button" class="btn ghost">Показать ещё раз</button>');replay.onclick=function(){shown++;replay.remove();replay=null;runFlash();};rw.insertBefore(replay,rw.firstChild);}},q.flash);shown+=0;}
  function runSeq(){
    setInput(false);var a=q.e.a,i=0;
    function step(){
      if(i>=a.length){flb.innerHTML='<div class="flcover">Сколько получилось?</div>';setInput(true);if(!it.test&&shown<2&&!replay){replay=h('<button type="button" class="btn ghost">Показать ещё раз</button>');replay.onclick=function(){shown++;replay.remove();replay=null;runSeq();};rw.insertBefore(replay,rw.firstChild);}return;}
      var v=a[i];flb.innerHTML='<div class="flnum" aria-live="assertive">'+(i===0?v:(v>0?'+ '+v:'− '+(-v)))+'</div>';i++;later(function(){flb.innerHTML='<div class="flnum dim">&nbsp;</div>';later(step,250);},1100);}
    later(step,300);}
  if(isFl)runFlash();else if(isSq)runSeq();
  function done(ok,msg){
    it.done=true;
    if(inp)inp.disabled=true;
    chk.textContent='Дальше';chk.disabled=false;chk.onclick=next;later(function(){chk.focus();},200);
    if(isAb)host._lock=true;
    if(replay)replay.remove();
    if(it.test&&R.mode==='lesson'){R.testN=(R.testN||0)+1;if(ok&&q.first)R.testOk=(R.testOk||0)+1;}
    fb.innerHTML=msg;}
  function check(v){
    if(it.done)return;
    if(v===q.ans){
      var ms=Date.now()-t0;recordResult(q,q.first,ms);
      done(true,'<div class="fb ok hc">'+clk('joy')+'<strong>'+pick(['Верно!','Да, точно!','Правильно!','Отлично!'])+'</strong></div>');return;}
    it.w++;q.first=false;
    var tries=it.help?3:2;
    if(it.test||it.w>=tries){
      recordResult(q,false,0);
      if(isAb)host._set(afrom(q.ans,q.len));
      done(false,'<div class="fb try hc">'+clk('sorry')+'<strong>'+(it.w>=2&&!it.test?'Ничего страшного.':'Пока не получилось.')+' Правильный ответ — '+q.ans+'.</strong>'+stepsHtml(q)+'<span>Этот пример мы ещё повторим.</span></div>');
      if(R.mode==='train'&&R.queue)R.queue.push(q.e);return;}
    fb.innerHTML='<div class="fb try hc">'+clk('sorry')+'<strong>Ой, давай посмотрим ещё раз.</strong><div class="hint">'+q.hint+'</div><span>Попробуй ещё раз.</span></div>';
    addShow();if(inp){inp.value='';inp.focus();}}
  chk.onclick=function(){
    if(chk.textContent==='Дальше'){next();return;}
    if(isAb){check(aval(vals));return;}
    var raw=String(inp.value).trim();if(raw===''||isNaN(Number(raw))){fb.innerHTML='<div class="fb try"><strong>Введи число.</strong></div>';return;}check(Number(raw));};
  if(inp)inp.onkeydown=function(e){if(e.key==='Enter'||e.keyCode===13)chk.onclick();};}

/* ---------- считаем вместе: двигаем бусины по шагам ---------- */
function rGuide(it){
  var q=it.q,g=mkG(q.e),k=0,ms=0,vals=g.start.slice(),opts={labels:true},card=h('<section class="card lift"></section>');
  card.innerHTML=headFor(it)+'<p class="ask-lead">'+(/^set/.test(q.type)?'Набираем число вместе: делай то, что просит подсказка.':'Считаем вместе: делай то, что просит подсказка.')+'</p><div class="eq'+(q.eq.length>14?' sm':'')+'">'+q.eq+'</div><div id="abx"></div><div id="gp" class="gp"></div><div class="answer"><button type="button" class="btn" id="chk">Проверить</button></div><div id="fb" aria-live="polite"></div>';
  app.appendChild(card);
  var host=$('#abx',card),chk=$('#chk',card),fb=$('#fb',card),gp=$('#gp',card),fin=false;
  mountAbacus(host,vals,opts);
  function same(a,b){var i;for(i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;}
  function next(){R.i++;render();window.scrollTo(0,0);}
  function paint(){
    if(k>=g.steps.length){fin=true;host._lock=true;opts.hl=undefined;host._set(vals);recordResult({type:q.type,key:q.key,e:q.e,first:it.w===0},it.w===0,0);
      gp.innerHTML='<p><b>Готово! '+(/^set/.test(q.type)?'На абакусе число '+q.ans+'.':'Ответ: '+q.ans+'.')+'</b></p>';chk.textContent='Дальше';later(function(){chk.focus();},200);return;}
    var s=g.steps[k];opts.hl=s.hl;host._set(vals);gp.innerHTML='<p>'+s.p+'</p>'+(s.sub?'<p class="small">'+s.sub+'</p>':'');ms=0;}
  chk.onclick=function(){
    if(fin){next();return;}
    var s=g.steps[k];
    if(same(vals,s.after)){fb.innerHTML='<div class="fb ok hc">'+clk('joy')+'<strong>'+pick(['Верно!','Да!','Точно!'])+'</strong></div>';k++;paint();return;}
    it.w++;ms++;
    if(ms>=2){var i;for(i=0;i<vals.length;i++)vals[i]=s.after[i];fb.innerHTML='<div class="fb try hc">'+clk('sorry')+'<strong>Ничего страшного. Вот как должно быть.</strong><div class="hint">'+s.hint+'</div><span>Идём дальше.</span></div>';k++;paint();return;}
    fb.innerHTML='<div class="fb try hc">'+clk('sorry')+'<strong>Ой, давай посмотрим ещё раз.</strong><div class="hint">'+s.hint+'</div><span>Попробуй ещё раз.</span></div>';};
  paint();}

function finishModule(){
  stopTimer();var m=R.mod,n=R.testN||3,ok=R.testOk||0;
  var st=ok>=n?3:(ok>=Math.ceil(n*2/3)?2:1);
  M.done[m.id]=true;M.stars[m.id]=Math.max(M.stars[m.id]||0,st);save();
  view={name:'done',id:m.id,ok:ok,n:n,st:st};render();}
function rDone(){
  var m=modById(view.id),idx=MODS.indexOf(m),nx=MODS[idx+1];

/* ---------- тренажёр ---------- */
function availTypes(){return tier()==='free'?['set1','rd1']:ALL_T.slice();}
function pickType(types){var w=types.map(function(t){return 1+4*badRate(t);}),sum=w.reduce(function(a,b){return a+b;},0),r=Math.random()*sum,i;for(i=0;i<types.length;i++){r-=w[i];if(r<=0)return types[i];}return types[0];}
function startTrain(){
  if(tier()==='free'&&usedMin()>=FREE_MIN){view={name:'buy',why:'limit'};render();return;}
  var types=availTypes(),items=[],due=[];
  if(tier()==='pro'){var now=Date.now();Object.keys(M.sr).forEach(function(k){var s=M.sr[k];if(s&&s.e&&s.due<=now)due.push(s.e);});due=due.slice(0,3);}
  due.forEach(function(e){items.push({kind:'ask',q:mkQ(e),phase:'Повторение',test:false,w:0});});
  while(items.length<10)items.push({kind:'ask',q:mkQ(gen(pickType(types))),phase:'Тренажёр',test:false,w:0});
  R={mode:'train',items:items,i:0,queue:[],repeated:false};view={name:'train'};startTimer();render();}
function rTrain(){
  if(R&&R.mode==='train'){rRun();return;}
  var weak=ALL_T.filter(function(t){return badRate(t)>=0.3;}).map(function(t){return TYPES[t].name;});
  var sr=Object.keys(M.sr).length;
  app.innerHTML='<section class="card lift"><p class="kicker">5–10 минут в день</p><h1>Тренажёр</h1><p class="lead" style="margin-top:12px">Около десяти заданий: набрать число, посчитать на абакусе, запомнить образ, сосчитать цепочку в уме. Таймера на вопросах нет. Если пример не получился, он вернётся позже.</p>'
   +(weak.length?'<p>Чаще попадутся: <b>'+weak.join(', ')+'</b>.</p>':'<p class="small">Пока мы изучаем, что тебе даётся легко, а что труднее.</p>')
   +(atLeast('pro')?'<p class="small">Примеров на повторении: '+sr+'. Они возвращаются через 1, 3, 7 и 14 дней.</p>':'<p class="small">В бесплатной версии тренажёр даёт задания на набор и чтение цифр, до '+FREE_MIN+' минут в день. Счёт на абакусе и ментальные задания откроет тариф «Ментальная арифметика» или «Комбо».</p>')
   +'<div class="row"><button type="button" class="btn" id="go">Начать</button><button type="button" class="btn ghost" data-v="home">К модулям</button></div></section>';
  $('#go').onclick=startTrain;}
function rSum(){
  var wk=view.weak||[];
  app.innerHTML='<section class="card lift"><div class="phase">Итог</div><h2 style="margin:0 0 10px">Тренировка закончена</h2><p>С первого раза верно: <b>'+view.ok+' из '+view.n+'</b>.</p>'

  stopTimer();var ok=0,wk=[];
  R.items.forEach(function(it){if(it.kind==='ask'){if(it.done&&it.w===0)ok++;else if(it.w>0)wk.push(it.q.eq.replace(/<\/?b>/g,''));}});
  view={name:'sum',mode:R.mode,ok:ok,n:R.items.length,weak:wk.slice(0,6)};R=null;render();}

   +'<section class="card" style="margin-top:14px"><h3>Модули</h3><div class="bars">'+MODS.map(function(m){return '<div><span>'+m.title+'</span><b>'+(M.done[m.id]?starsStr(M.stars[m.id]||1):(locked(m)?'закрыт':'не пройден'))+'</b></div>';}).join('')+'</div></section>'

   +'<section class="card" style="margin-top:14px"><h3>Доступ</h3><p class="small">«Ментальная арифметика»: <b>'+TIER_NAME[tier()]+'</b>. «Умножение»: <b>'+TIER_NAME[mainMult]+'</b>. «Устный счёт»: <b>'+TIER_NAME[mainMental]+'</b>. «Быстрый счёт»: <b>'+TIER_NAME[mainTrach]+'</b>. Коды тарифа «Комбо» открывают все четыре тренажёра сразу.</p><div class="row"><button type="button" class="btn ghost" data-v="plans">Тарифы и код доступа</button><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="trainer.html">Умножение</a><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="mental.html">Устный счёт</a><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="trahtenberg.html">Быстрый счёт</a></div></section>'
   +'<section class="card" style="margin-top:14px"><h3>Сохранить прогресс</h3><p class="small">Прогресс хранится в браузере этого устройства. Сохраните файл, чтобы перенести его на другое устройство.</p><div class="row"><button type="button" class="btn" id="exp">Экспортировать</button><label class="btn ghost" for="imp" style="cursor:pointer">Импортировать</label><input type="file" id="imp" accept="application/json,.json" hidden></div><div id="expmsg" class="small" aria-live="polite"></div></section>'
   +'<p style="margin-top:14px"><button type="button" class="btn ghost" data-v="home">К модулям</button></p>';
  $('#exp').onclick=function(){
    var txt=JSON.stringify(exportData(),null,1),msg=$('#expmsg');
    try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='abakus-progress-'+dayKey()+'.json';document.body.appendChild(a);a.click();a.remove();msg.textContent='Файл сохранён. Если он не появился в загрузках, скопируйте текст ниже.';}catch(e){msg.textContent='Не получилось сохранить файл. Скопируйте текст ниже.';}
    msg.insertAdjacentHTML('afterend','<textarea class="ans" style="width:100%;height:120px;font-size:13px" readonly>'+txt.replace(/</g,'&lt;')+'</textarea>');};
  $('#imp').onchange=function(){var f=this.files[0],msg=$('#expmsg');if(!f)return;if(f.size>2e6){msg.textContent='Файл слишком большой.';return;}
    var r=new FileReader();r.onload=function(){var o;try{o=JSON.parse(r.result);}catch(e){msg.textContent='Файл повреждён: это не JSON.';return;}
      if(!o||o.app!=='abakus'||!o.progress){msg.textContent='Это не файл прогресса «Ментальной арифметики».';return;}
      var n=adopt(o.progress);
      Object.keys(n.done).forEach(function(k){if(n.done[k])M.done[k]=true;});
      Object.keys(n.stars).forEach(function(k){M.stars[k]=Math.max(M.stars[k]||0,Number(n.stars[k])||0);});
      Object.keys(n.stats).forEach(function(k){var a=n.stats[k],b=M.stats[k]||(M.stats[k]={ok:0,bad:0});b.ok=Math.max(b.ok,Number(a.ok)||0);b.bad=Math.max(b.bad,Number(a.bad)||0);});
      Object.keys(n.rec).forEach(function(k){var a=n.rec[k];if(a&&a.best&&(!M.rec[k]||a.best<M.rec[k].best))M.rec[k]={best:a.best};});
      if(RANK[n.tier]>RANK[M.tier])M.tier=n.tier;
      save();msg.textContent='Готово. Прогресс объединён.';};
    r.onerror=function(){msg.textContent='Не удалось прочитать файл.';};r.readAsText(f);};}

/* ---------- тарифы и коды ---------- */
function sha256hex(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
function applyTier(g){
  /* g: {mult, mental, trach, abak}. Свой тариф хранится здесь и дублируется в общую запись, чтобы его увидели остальные тренажёры. */
  if(g.abak&&RANK[g.abak]>RANK[M.tier]){M.tier=g.abak;save();}
  Store.get('progress').then(function(v){
    v=(v&&typeof v==='object')?v:{};
    var ch=false,ti=function(x){return RANK[x]||0;};
    if(g.abak&&ti(g.abak)>ti(v.tierAbak)){v.tierAbak=g.abak;ch=true;mainTier=g.abak;}
    if(g.trach&&ti(g.trach)>ti(v.tierTrach)){v.tierTrach=g.trach;ch=true;mainTrach=g.trach;}
    if(g.mental&&ti(g.mental)>ti(v.tierMental)){v.tierMental=g.mental;ch=true;mainMental=g.mental;}
    if(g.mult&&ti(g.mult)>ti(v.tierMult)){v.tierMult=g.mult;v.tier=g.mult;ch=true;mainMult=g.mult;}
    if(ch){v.adv=true;return Store.put('progress',v);}}).catch(function(){});}
function tryCode(code,msg,ok){
  if(!(window.crypto&&crypto.subtle)){msg.textContent='Проверка кода недоступна в этом браузере.';return;}
  if(!anyCodes()){msg.textContent='Коды доступа ещё не настроены.';return;}
  sha256hex(String(code).trim().toUpperCase()).then(function(hx){
    var g=codeGrant(hx);
    if(!g){msg.textContent='Код не подошёл. Проверьте, нет ли лишних символов.';return;}
    var nt=g.abak&&RANK[g.abak]>RANK[tier()]||g.trach&&RANK[g.trach]>RANK[mainTrach],nm=g.mental&&RANK[g.mental]>RANK[mainMental],nu=g.mult&&RANK[g.mult]>RANK[mainMult];
    if(!nt&&!nm&&!nu){msg.textContent='Этот код ничего не добавит: у вас уже открыт такой тариф или выше.';return;}
    applyTier(g);ok();}).catch(function(){msg.textContent='Не удалось проверить код.';});}
function rBuy(){
  var why=view.why||'plans',title,lead;
  if(why==='limit'){title='На сегодня всё!';lead='Бесплатный доступ: '+FREE_MIN+' минут занятий в день. Прогресс сохранён. Чтобы заниматься без ограничений, выберите «Ментальную арифметику» или «Комбо». Завтра бесплатные минуты появятся снова.';}
  else if(why==='block'){title='Модуль «'+(view.title||'')+'» входит в платные тарифы';lead='В бесплатной версии открыт первый модуль «Знакомство с абакусом». Остальные модули откроет тариф «Ментальная арифметика» или «Комбо». Оплата один раз, без подписки.';}
  else{title='Тарифы';lead='Бесплатная версия остаётся навсегда: модуль «Знакомство с абакусом» и задания на набор и чтение цифр до '+FREE_MIN+' минут в день. Платные тарифы оплачиваются один раз, без подписки. Коды «Комбо» открывают все четыре тренажёра сразу.';}
  app.innerHTML='<section class="card lift"><h1 style="margin:0 0 10px">'+title+'</h1><p class="lead">'+lead+'</p></section>'+tariffCols('abak')
   +'<section class="card" style="margin-top:14px"><h3>У меня есть код</h3><div class="answer"><input class="ans" style="width:14ch;font-size:24px" id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Код доступа"><button type="button" class="btn" id="codego">Открыть доступ</button></div><p class="small" id="codemsg" aria-live="polite"></p><p class="small">Оплата проходит на странице платёжного сервиса. Здесь мы не просим данные карты, имя, почту или телефон. После оплаты на странице успеха появится код доступа. Введите его здесь.</p></section><p style="margin-top:14px"><button type="button" class="btn ghost" data-v="home">Назад</button></p>';
  var inp=$('#code'),msg=$('#codemsg');
  function go2(){tryCode(inp.value,msg,function(){go({name:'home'});});}
  $('#codego').onclick=go2;inp.onkeydown=function(e){if(e.key==='Enter'||e.keyCode===13)go2();};}

/* ---------- события и запуск ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-v],[data-start]');if(!t)return;
  if(t.hasAttribute('data-start')){startModule(t.getAttribute('data-start'));return;}
  var v=t.getAttribute('data-v');
  if(v==='plans'){go({name:'buy',why:'plans'});return;}
  go({name:v});});
function boot(){
  Store.get('abak').then(function(v){storage.mode='idb';if(v)M=adopt(v);})
   .catch(function(){storage.mode='memory';})
   .then(function(){return Store.get('progress').then(function(v){if(v){if(RANK[v.tierAbak]!==undefined)mainTier=v.tierAbak;if(RANK[v.tierTrach]!==undefined)mainTrach=v.tierTrach;if(RANK[v.tierMental]!==undefined)mainMental=v.tierMental;if(RANK[v.tierMult]!==undefined)mainMult=v.tierMult;else if(RANK[v.tier]!==undefined)mainMult=v.tier;}}).catch(function(){});})
   .then(function(){render();});}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});}
boot();
})();
